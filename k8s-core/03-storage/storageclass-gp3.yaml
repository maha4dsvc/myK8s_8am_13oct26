# EKS only: a default StorageClass that creates gp3 EBS volumes through the EBS CSI driver.
# Apply it only if `kubectl get sc` shows no "(default)" class. Needs the aws-ebs-csi-driver add-on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer   # create the disk in the zone where the pod runs
allowVolumeExpansion: true
