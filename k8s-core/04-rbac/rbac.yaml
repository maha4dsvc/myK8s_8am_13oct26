# A read-only identity for the k8s-lab namespace:
#   ServiceAccount "viewer"  +  Role "pod-reader" (pods and logs, read only)  +  RoleBinding
# Test:  kubectl auth can-i list pods -n k8s-lab --as=system:serviceaccount:k8s-lab:viewer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: k8s-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: k8s-lab
rules:
- apiGroups: [""]                      # "" = core API group (pods, services, secrets…)
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-reads-pods
  namespace: k8s-lab
subjects:
- kind: ServiceAccount
  name: viewer
  namespace: k8s-lab
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
