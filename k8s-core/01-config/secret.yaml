# Sensitive settings. stringData = you write plain text, Kubernetes stores it base64-encoded.
# DEMO VALUES ONLY. Never commit a real password to Git: create real Secrets with
#   kubectl create secret generic booking-secret -n k8s-lab --from-literal=DB_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: booking-secret
  namespace: k8s-lab
type: Opaque
stringData:
  DB_USER: booking
  DB_PASSWORD: Demo-only-123
