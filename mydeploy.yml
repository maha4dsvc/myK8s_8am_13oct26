apiVersion: apps/v1
kind: Deployment
metadata:
  name: myjavaapp-deploy
  labels:
     app: myjavaapp
spec:
   replicas: 2
   selector:
      matchLabels:
        app: myjavaapp
   template:
     metadata:
        labels:
          app: myjavaapp
     spec:
      containers:
      - name: myjavaapp-container
        image: 992558785875.dkr.ecr.us-east-2.amazonaws.com/myjavaapp:1
        ports:
        - containerPort: 8080
